[package]
name = "iliada-account"
version = "0.1.0"
edition = "2024"
description = "The Iliada account server: sign-in, computers, encrypted data"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
hex = "0.4.3"
rand = "0.10.3"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }
